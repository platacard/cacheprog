services:
  toxiproxy:
    image: ${TOXIPROXY_IMAGE:-ghcr.io/shopify/toxiproxy:2.12.0}
    restart: always
    ports:
      - "8474:8474"
      - "9000:9000" # for RustFS S3, simulate network latency
    volumes:
      - ./toxiproxy.json:/toxiproxy.json:ro
    command: -config /toxiproxy.json
    networks:
      - rustfs_network
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    restart: always
    ports:
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-rustfsadmin}"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rustfs_network
  rc:
    image: ${RC_IMAGE:-rustfs/rc:v0.1.36}
    container_name: rustfs-client
    depends_on:
      rustfs:
        condition: service_healthy
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu;
        until rc alias set myrustfs http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"; do
          echo 'Waiting for RustFS to be ready...'
          sleep 1
        done;
        rc mb --ignore-existing myrustfs/files-bucket;
        read -s;
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-rustfsadmin}"
    healthcheck:
      test: ["CMD", "rc", "bucket", "list", "myrustfs"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - rustfs_network
    stdin_open: true
    tty: true

networks:
  rustfs_network:

volumes:
  rustfs_data:
